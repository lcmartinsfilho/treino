name: Gerar treino em Markdown

on:
  push:
    paths:
      - "Treino_Dom_Core.xlsx"
      - "scripts/xlsx_to_md.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/xlsx_to_md.py Treino_Dom_Core.xlsx Treino_Dom_Core.md
      - name: Commit se houve mudança
        run: |
          if [ -n "$(git status --porcelain Treino_Dom_Core.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Treino_Dom_Core.md
            git commit -m "chore: atualiza treino em markdown"
            git push
          fi
