name: Gerar epub do treino

on:
  push:
    paths:
      - "treino.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: >
          pandoc treino.md -o treino.epub
          --metadata lang=pt-BR --metadata title="Treino - Dom Core" --split-level=2
      - name: Commit se houve mudança
        run: |
          if [ -n "$(git status --porcelain treino.epub)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add treino.epub
            git commit -m "chore: atualiza epub do treino"
            git push
          fi
